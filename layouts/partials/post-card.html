{{- /* A post as a card: date, title, description. Pass a Page. Used on the
       homepage, the posts list, and the 404 page. */ -}}
<article class="card">
  <p class="card-meta"><span class="card-date">{{ .Date.Format "Jan 2006" }}</span></p>
  <p class="card-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></p>
  {{- with .Description }}<p class="card-desc">{{ . | markdownify }}</p>{{ end }}
</article>
