baseURL = 'https://mackeracher.com/'
languageCode = 'en-us'
title = 'Anson MacKeracher'
theme = "typo"
# Last-modified dates from git. Only the Now page shows one (showUpdated).
enableGitInfo = true

[module]
  [[module.imports]]
    path = "github.com/divinerites/plausible-hugo"

[params]
description = "Essays, projects, and the Norns series from Anson MacKeracher."
paginationSize = 20
faviconPath = "https://mackeracher.com"

# Appearance settings
theme = 'auto'
colorPalette = 'default'
hideHeader = false
# Post cards on the homepage and /posts reuse each post's social card as a
# thumbnail. Set false to drop the pictures and keep text-only cards.
cardThumbs = false

# Breadcrumbs
[params.breadcrumbs]
enabled = false

# Social card for the homepage (see assets/og/README.md)
[params.og]
homeTitle = "Reliable systems under unreliable conditions"
homeDescription = "Essays, projects, and the Norns series."

# Plausible Analytics
[params.plausible]
  enable = true
  gitstar = false
  domain = "mackeracher.com"

# Social icons
[[params.social]]
name = "linkedin"
url = "https://www.linkedin.com/in/amackera"

[[params.social]]
name = "github"
url = "https://github.com/amackera"

[[params.social]]
name = "HN"
url = "https://news.ycombinator.com/user?id=amackera"

[[params.social]]
name = "X"
url = "https://x.com/amackera"

[[params.social]]
name = "Bluesky"
url = "https://bsky.app/profile/amackera.bsky.social"

[[params.social]]
name = "Email"
url = "mailto:anson@mackeracher.com"

# Main menu pages
[[params.menu]]
name = "home"
url = "/"

[[params.menu]]
name = "posts"
url = "/posts"

[[params.menu]]
name = "projects"
url = "/projects"

[[params.menu]]
name = "norns"
url = "/norns"

[[params.menu]]
name = "now"
url = "/now"

[[params.menu]]
name = "cv"
url = "/cv"

[[params.menu]]
name = "photos"
url = "/photos"

# Syntax highligth on code blocks
[markup]
[markup.goldmark.renderer]
unsafe = true
[markup.goldmark.parser]
wrapStandAloneImageWithinParagraph = false
[markup.highlight]
style = 'friendly'
